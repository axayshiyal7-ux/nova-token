<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA Token</title>

  <meta name="description" content="Official NOVA Token project page">

  <style>
    body {
      margin: 0;
      background: #0b0d1a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 50px 20px;
    }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      border-radius: 25px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
    }

    .subtitle {
      color: #aaa;
      font-size: 18px;
    }

    .card {
      background: #15182a;
      border-radius: 18px;
      padding: 25px;
      margin-top: 30px;
      text-align: left;
    }

    .label {
      color: #999;
      font-size: 14px;
      margin-top: 15px;
    }

    .value {
      word-break: break-all;
      font-size: 15px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <div class="container">

    <img
      class="logo"
      src="logo.png"
      alt="NOVA Token Logo"
    >

    <h1>🚀 NOVA</h1>

    <p class="subtitle">
      Official NOVA Token Project
    </p>

    <div class="card">

      <div class="label">Token Name</div>
      <div class="value">NOVA</div>

      <div class="label">Symbol</div>
      <div class="value">NOVA</div>

      <div class="label">Network</div>
      <div class="value">Polygon</div>

      <div class="label">Contract Address</div>
      <div class="value">
        0xf28eefc8f87d753f4a33b9dbdf6cf63255d51772
      </div>

    </div>

  </div>

</body>
</html>
